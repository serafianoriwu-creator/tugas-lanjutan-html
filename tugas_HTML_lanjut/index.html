<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            font-size: 13px;
        }
        h1 {
            font-size: 22px;
        }
        fieldset {
            width: 520px;
            margin-bottom: 15px;
            border: 1px solid #aaa;
        }
        legend {
            color: #222;
            font-weight: normal;
        }
        label {
            display: inline-block;
            width: 130px;
            margin-bottom: 7px;
            vertical-align: top;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"],
        textarea,
        select {
            width: 250px;
            padding: 4px;
            border: 1px solid #aaa;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        /* Yang biru hanya lingkaran radio yang sedang dipilih */
        input[type="radio"] {
            accent-color: #0066ff;
        }
        .inline {
            width: auto;
        }
        .buttons {
            margin-top: 10px;
        }
        button {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<h1>Form Registrasi</h1>

<form action="#" method="post">

    <fieldset>
        <legend>Biodata</legend>

        <label for="nama">Nama Mahasiswa</label>
        <input type="text" id="nama" name="nama" placeholder="Nama Anda">
        <br>

        <label for="nim">No Induk Mahasiswa (NIM)</label>
        <input type="text" id="nim" name="nim" placeholder="123456789">
        <br>

        <label for="alamat">Alamat Mahasiswa</label>
        <textarea id="alamat" name="alamat" placeholder="Alamat Anda"></textarea>
        <br>

        <label for="tanggal">Tanggal Lahir</label>
        <select id="tanggal" name="tanggal">
            <option>01</option>
            <option>02</option>
            <option>03</option>
            <option>04</option>
            <option>05</option>
        </select>

        <select name="bulan">
            <option>Januari</option>
            <option>Februari</option>
            <option>Maret</option>
            <option>April</option>
        </select>

        <select name="tahun">
            <option>1980</option>
            <option>1990</option>
            <option>2000</option>
            <option>2001</option>
            <option>2002</option>
            <option>2003</option>
        </select>
        <br>

        <label>Jenis Kelamin</label>
        <input class="inline" type="radio" id="pria" name="gender" value="pria" checked>
        <label class="inline" for="pria">Pria</label>

        <input class="inline" type="radio" id="wanita" name="gender" value="wanita">
        <label class="inline" for="wanita">Wanita</label>
        <br>

        <label for="foto">Upload Foto</label>
        <input type="file" id="foto" name="foto">
        <br>

        <label for="website">URL Website</label>
        <input type="url" id="website" name="website" placeholder="URL Website Anda">
        <br>

        <label for="kampus">Perguruan Tinggi</label>
        <input type="text" id="kampus" name="kampus" placeholder="Nama Perguruan Tinggi">
    </fieldset>

    <fieldset>
        <legend>Info Akun</legend>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email Anda">
        <br>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Username Anda">
        <br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password Anda">
        <br>

        <label for="password2">Ulangi Password</label>
        <input type="password" id="password2" name="password2" placeholder="Password Anda">
    </fieldset>

    <fieldset>
        <legend>Kemampuan Dasar</legend>

        <input type="checkbox" id="html" name="skill" value="HTML">
        <label class="inline" for="html">HTML</label>

        <input type="checkbox" id="css" name="skill" value="CSS">
        <label class="inline" for="css">CSS</label>

        <input type="checkbox" id="js" name="skill" value="JavaScript">
        <label class="inline" for="js">Javascript</label>

        <input type="checkbox" id="php" name="skill" value="PHP">
        <label class="inline" for="php">PHP</label>

        <input type="checkbox" id="mysql" name="skill" value="MySQL">
        <label class="inline" for="mysql">MySQL</label>

        <input type="checkbox" id="laravel" name="skill" value="Laravel">
        <label class="inline" for="laravel">Laravel</label>

        <input type="checkbox" id="react" name="skill" value="React Native">
        <label class="inline" for="react">React Native</label>
    </fieldset>

    <div class="buttons">
        <button type="reset">Reset</button>
        <button type="submit">Simpan</button>
        <button type="button" onclick="alert('Tombol berhasil ditekan!')">Button</button>
    </div>

</form>

</body>
</html>
